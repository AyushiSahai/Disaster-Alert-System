<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Disaster Alerts</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    input, button { width: 100%; padding: 10px; margin: 6px 0; }
    .row { display:flex; gap:8px; }
  </style>
</head>
<body>
  <h1>Weather Alert</h1>
  <div class="row">
    <input id="city" placeholder="Enter city, e.g., Hyderabad" />
    <button id="check">Check & Alert</button>
  </div>
  <pre id="out"></pre>
  <script>
    const btn = document.getElementById("check");
    btn.addEventListener("click", async () => {
      const email = localStorage.getItem("userEmail");
      const city = document.getElementById("city").value;
      const res = await fetch("/api/weather-alert", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, city }),
      });
      const json = await res.json();
      document.getElementById("out").textContent = JSON.stringify(json, null, 2);
    });
  </script>
</body>
</html>
